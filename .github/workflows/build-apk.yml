
name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

     
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16.0'

      - name: Install Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@^7 @capacitor/android@^7
          npm install --save-dev @capacitor/cli@^7


      - name: Prepare web files
        run: |
          mkdir -p www

          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            FIRST_HTML=$(find . -maxdepth 1 -type f -name '*.html' | head -n 1)
            if [ -z "$FIRST_HTML" ]; then
              echo "No HTML file found in repository root."
              exit 1
            fi
            cp "$FIRST_HTML" www/index.html
          fi

          for item in *.css *.js *.png *.jpg *.jpeg *.gif *.svg *.webp *.ico assets css js img images; do
            if [ -e "$item" ] && [ "$item" != package.json ] && [ "$item" != package-lock.json ]; then
              cp -r "$item" www/
            fi
          done

      - name: Configure Capacitor
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.esam.firstcapacitorapp",
            "appName": "1st Capacitor App",
            "webDir": "www"
          }
          EOF
          fi

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
