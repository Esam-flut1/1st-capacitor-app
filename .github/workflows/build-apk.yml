name: Build Android Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
  steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create package.json and install Capacitor
        run: |
          if [ ! -f "package.json" ]; then
            cat << 'EOF' > package.json
          {
            "name": "first-capacitor-app",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          fi
          npm install
          npm install @capacitor/core@^7.0.0 @capacitor/android@^7.0.0 --save
          npm install @capacitor/cli@^7.0.0 --save-dev

      - name: Prepare www/ directory from standalone HTML
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp "index.html" "www/index.html"
          else
            FIRST_HTML=$(find . -maxdepth 1 -type f -name "*.html" | head -n 1)
            if [ -n "$FIRST_HTML" ]; then
              echo "Using $FIRST_HTML as www/index.html"
              cp "$FIRST_HTML" "www/index.html"
            else
              echo "No HTML file found in the root directory!"
              exit 1
            fi
          fi
          for item in *.css *.js *.png *.jpg *.jpeg *.gif *.svg *.webp *.ico *.json assets css js img images; do
            if [ -e "$item" ] && [ "$item" != "package.json" ] && [ "$item" != "package-lock.json" ] && [ "$item" != "capacitor.config.json" ]; then
              cp -r "$item" www/
            fi
          done

      - name: Configure Capacitor and add Android platform
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.esam.firstcapacitorapp",
            "appName": "1st Capacitor App",
            "webDir": "www"
          }
          EOF
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
